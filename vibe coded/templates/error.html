{% extends "base.html" %}

{% block title %}Error - Meraki OAuth Manager{% endblock %}

{% block content %}
<div class="main-container fade-in">
    <div class="text-center py-5">
        <div class="icon-circle danger mx-auto mb-4" style="width: 100px; height: 100px; font-size: 3rem;">
            <i class="bi bi-exclamation-triangle"></i>
        </div>
        
        <h1 class="mb-3">Authentication Error</h1>
        
        <div class="alert alert-danger mx-auto" style="max-width: 600px;">
            <h4 class="alert-heading">
                <i class="bi bi-x-circle"></i> {{ error }}
            </h4>
            <hr>
            <p class="mb-0">{{ error_description }}</p>
        </div>
        
        <div class="mt-4">
            <a href="/" class="btn btn-primary btn-lg me-2">
                <i class="bi bi-house"></i> Go Home
            </a>
            <a href="/login" class="btn btn-meraki btn-lg">
                <i class="bi bi-arrow-repeat"></i> Try Again
            </a>
        </div>
    </div>
</div>
{% endblock %}
